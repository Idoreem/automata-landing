name: CI

# בדיקה אוטומטית לכל push ו-PR: שהפרויקט מתקמפל ושהטיפוסים תקינים.
# מטרה: לא לגלות בעיה רק אחרי שהיא כבר בפרודקשן.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
